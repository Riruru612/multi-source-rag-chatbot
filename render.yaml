services:
  - type: web
    name: streamlit-rag-chatbot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    plan: free
    autoDeploy: true
    envVars:
      - key: GROQ_API
        sync: false
      - key: HF_TOKEN
        sync: false